# nvidia-riva-client gRPC connection
#
# SAP AI Core staging: a SINGLE gRPC gateway host fronts all models; the model
# is selected by the `deployment-id` metadata (+ `ai-resource-group`), not by a
# per-model hostname. Auth is a short-lived XSUAA Bearer token.
#
# Auth — provide EITHER:
#   export AICORE_BEARER_TOKEN=<jwt>          # static, no refresh (expires ~12h)
# OR (recommended for long runs — auto-refreshes):
#   export AICORE_CLIENT_ID=<clientid>
#   export AICORE_CLIENT_SECRET=<clientsecret>
#   export AICORE_AUTH_URL=https://staging-llm-access.authentication.sap.hana.ondemand.com
riva:
  use_ssl: true
  auth_token_env: AICORE_BEARER_TOKEN
  resource_group: default
  client_id_env: AICORE_CLIENT_ID
  client_secret_env: AICORE_CLIENT_SECRET
  auth_url_env: AICORE_AUTH_URL

stt:
  grpc_uri: realtime.ai.staging.eu-west-1.mlf-aws-dev.com:443
  deployment_id: d4519ec6fdc44c0a        # nim-nemotron-asr
  model_name: nemotron-asr               # label only; gRPC routes by deployment_id
  rest_endpoint: https://api.ai.staging.eu-west-1.mlf-aws-dev.com/v2/inference/deployments/d4519ec6fdc44c0a/v1/audio/transcriptions
  language_code: en-US
  auth_header: Authorization
  request_timeout_s: 120
  # Offline/batch Recognize is UNIMPLEMENTED on this gateway — recognize_batch()
  # transparently falls back to StreamingRecognize when this is false.
  supports_batch: false
  # REST inference proxy returns HTTP 500 for this deployment.
  supports_rest: false
  # Test 1.12 (multilingual, FLEURS) — MULTILINGUAL RUN: all 18 SAP Joule
  # languages (15 GA + 3 preview). The model (Nemotron-3.5-Transcribe)
  # auto-detects language, so the per-request code is only a hint. Empty = all
  # Joule; listed explicitly here to make the multilingual run intent clear.
  multilingual_languages: [en, de, fr, es, pt, nl, pl, ko, el, ja, zh, vi, th, id, ar, cs, it, tr]
  # Tier-A per-language depth (1.5 noise, 1.9 output quality), measured on FLEURS
  # IN ADDITION to the unchanged English pass. MULTILINGUAL RUN: all 18 Joule.
  # Languages the endpoint returns blank for (th/ar/id on this deployment) record
  # a graceful no_output row, never a fabricated score.
  multilingual_extra_languages: [en, de, fr, es, pt, nl, pl, ko, el, ja, zh, vi, th, id, ar, cs, it, tr]
  # Tier-B spot-checks (1.2 performance, 1.7 long-form, 1.10 confidence) — a
  # representative set spanning scripts/resource levels, not all 18 (these tests
  # are language-sensitive but second-order; full breadth isn't worth the cost).
  spot_check_languages: [en, de, ja, th, ar]

tts:
  grpc_uri: realtime.ai.staging.eu-west-1.mlf-aws-dev.com:443
  deployment_id: d9b39503a6dd78fc        # nim-magpie
  model_name: Magpie-Multilingual.EN-US.Aria
  voice_name: Magpie-Multilingual.EN-US.Aria
  rest_endpoint: https://api.ai.staging.eu-west-1.mlf-aws-dev.com/v2/inference/deployments/d9b39503a6dd78fc/v1/audio/synthesize_online
  language_code: en-US
  auth_header: Authorization
  request_timeout_s: 60
  sample_rate: 22050
  # Hard model limit confirmed in production: inputs >400 tokens fail with
  # StatusCode.UNKNOWN "Input sentence is longer than maximum sequence length: N > 400"
  max_sequence_tokens: 400
  supports_rest: false
  # Per-language TTS passes (2.1 naturalness, 2.2 intelligibility, 2.3 prosody,
  # 2.9 acceptance). Keys from en|fr|es — the only languages Magpie TTS
  # Multilingual supports. MULTILINGUAL RUN: all three.
  # Run 2.9 first to confirm the deployment actually exposes fr/es voices.
  multilingual_languages: [en, fr, es]
  # Override documented voice names if this deployment serves different voice
  # strings, e.g. {fr: "Some.Other.Voice"}. Empty = use the documented voices.
  voice_overrides: {}

evaluation:
  stt_concurrency_levels: [1, 5, 10, 20]
  tts_concurrency_levels: [1, 5, 10, 20]
  bootstrap_n: 1000
  results_dir: results/
  log_level: INFO
  data_dir: eval/data/
